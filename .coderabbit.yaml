# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_instructions:
    - path: "app/src/main/java/**"
      instructions: |
        Patuhi panduan arsitektur SwiftGrab (AGENTS.md dan DESIGN.md):
        1. Jetpack Compose UI: Komposabel harus stateless (UDF), hindari rekomposisi berulang pada LazyColumn, gunakan key stabil.
        2. Inisialisasi biner native (youtubedl-android, ffmpeg, aria2c) wajib asinkron di Dispatchers.IO.
        3. Background Service: Patuhi aturan Android 14/15 foregroundServiceType="dataSync" dan timeout handling.
        4. Larangan keras: Jangan pernah menyertakan SDK iklan, analitik pihak ketiga, atau pelacakan tersembunyi.
        5. Pause/Resume: Pause menggunakan destroyProcessById(taskId) tanpa menghapus berkas .part/.aria2; resume menggunakan flag --continue.
