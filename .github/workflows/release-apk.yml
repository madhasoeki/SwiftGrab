name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.0.1). Leave blank to use versionName from build.gradle.kts'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine Version Tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            TAG="v${VERSION_NAME:-0.0.1}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Decode Keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from KEYSTORE_BASE64..."
            if echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ runner.temp }}/release.jks" 2>/dev/null && [ -s "${{ runner.temp }}/release.jks" ]; then
              echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
              echo "Keystore successfully decoded to ${{ runner.temp }}/release.jks"
            else
              rm -f "${{ runner.temp }}/release.jks"
              echo "Decoded keystore is invalid or empty. Proceeding with fallback debug signing."
            fi
          else
            echo "KEYSTORE_BASE64 secret is not configured or empty. Proceeding with fallback debug signing."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release Assets
        id: prepare
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p release-assets

          # Copy per-architecture split APKs and universal APK
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            filename=$(basename "$apk")
            if [ "$filename" = "app-release.apk" ]; then
              cp "$apk" "release-assets/SwiftGrab-${TAG}.apk"
            else
              abi=$(echo "$filename" | sed -E 's/app-(.*)-release\.apk/\1/')
              cp "$apk" "release-assets/SwiftGrab-${TAG}-${abi}.apk"
            fi
          done

          ls -lh release-assets/

          # Generate SHA256 checksums
          cd release-assets
          sha256sum *.apk > checksums.txt
          cat checksums.txt
          cd ..

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: SwiftGrab ${{ steps.vars.outputs.tag }}
          files: |
            release-assets/*.apk
            release-assets/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
